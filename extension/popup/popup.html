<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0f0f14;
      color: #e2e2e8;
      padding: 20px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .header svg { flex-shrink: 0; }
    .header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }
    .header p {
      font-size: 11px;
      color: #8888a0;
      margin-top: 2px;
    }
    .status-card {
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 8px;
      flex-shrink: 0;
    }
    .status-dot.connected { background: #22c55e; box-shadow: 0 0 8px #22c55e88; }
    .status-dot.disconnected { background: #ef4444; box-shadow: 0 0 8px #ef444488; }
    .status-label {
      display: flex;
      align-items: center;
      font-size: 13px;
    }
    .status-text {
      font-size: 11px;
      color: #8888a0;
      font-weight: 500;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-connect {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
    }
    .btn-connect:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-disconnect {
      background: #1a1a24;
      color: #ef4444;
      border: 1px solid #2a2a3a;
    }
    .btn-disconnect:hover { background: #241a1a; border-color: #3a2a2a; }
    .info {
      margin-top: 16px;
      padding: 12px;
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 10px;
      font-size: 11px;
      color: #8888a0;
      line-height: 1.5;
    }
    .info code {
      background: #2a2a3a;
      padding: 1px 5px;
      border-radius: 4px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: #a78bfa;
      font-size: 10.5px;
    }
    .tools-count {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #6366f1;
    }
    .tools-count span {
      background: #6366f120;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
      <rect width="28" height="28" rx="8" fill="#6366f1"/>
      <path d="M8 14h12M14 8v12" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <div>
      <h1>Claude Web Bridge</h1>
      <p>Connect your browser to Claude</p>
    </div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <div class="status-label">
        <div class="status-dot disconnected" id="statusDot"></div>
        <span id="statusText">Disconnected</span>
      </div>
      <span class="status-text" id="wsUrl">ws://localhost:7862</span>
    </div>
  </div>

  <button class="btn btn-connect" id="connectBtn">Connect</button>

  <div class="tools-count">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
    </svg>
    <span>19 tools</span> available for Claude
  </div>

  <div class="info">
    Ensure the MCP server is running:<br>
    <code>cd server && npm start</code><br><br>
    Then click <strong>Connect</strong> to link this browser to Claude.
  </div>

  <script src="popup.js"></script>
</body>
</html>
